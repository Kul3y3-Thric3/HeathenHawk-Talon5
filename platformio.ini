; ============================================================
;  HeathenHawk Talon5 — platformio.ini
;  M5Stack Tab5 Red Team Toolkit
;  Uses pioarduino stable platform + M5Stack 3.3.8 include/lib paths
; ============================================================

[platformio]
default_envs = talon5

[env:talon5]
platform     = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework    = arduino
board        = m5stack-tab5-p4
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -D BOARD_TALON5
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D T5_DISPLAY_WIDTH=1280
    -D T5_DISPLAY_HEIGHT=720
    -D T5_HAS_TOUCH=1
    -D T5_HAS_CAMERA=1
    -D T5_HAS_IMU=1
    -D T5_HAS_SPEAKER=1
    -D T5_HAS_MIC=1
    -D T5_HAS_RTC=1
    -D T5_HAS_SD=1
    -D T5_HAS_C6=1
    -D DEBUG_SERIAL=1
    -D FEATURE_WIFI=1
    -D FEATURE_BLE=1
    -D FEATURE_GPS=1
    -D FEATURE_SD=1
    -D FEATURE_DEAUTH=1
    -D FEATURE_BEACON_SPAM=1
    -D FEATURE_EVIL_PORTAL=1
    -D FEATURE_WARDRIVING=1
    -D FEATURE_BLE_SPAM=1
    -D FEATURE_SKYSPY=1
    -D FEATURE_FLOCKYOU=1
    -D FEATURE_FOXHUNTER=1
    -D FEATURE_CAMERA=1
    -D FEATURE_AUDIO=1
    -D FEATURE_KEYBOARD=1
    -I/Users/eyeluk/Library/Arduino15/packages/m5stack/tools/esp32-libs/3.3.8/qio_qspi/include
    -I/Users/eyeluk/Library/Arduino15/packages/m5stack/tools/esp32-libs/3.3.8/include
    -L/Users/eyeluk/Library/Arduino15/packages/m5stack/tools/esp32-libs/3.3.8/dio_qspi
    -L/Users/eyeluk/Library/Arduino15/packages/m5stack/tools/esp32-libs/3.3.8/lib

lib_deps =
    m5stack/M5Unified @ ^0.2.19
    m5stack/M5GFX @ ^0.2.26
    mikalhart/TinyGPSPlus @ ^1.0.3
    bblanchon/ArduinoJson @ ^7.0.4
    fastled/FastLED @ ^3.6.0
    SPI
    SD
