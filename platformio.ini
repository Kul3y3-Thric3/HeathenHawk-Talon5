; ============================================================
;  HeathenHawk Talon5 — platformio.ini
;  M5Stack Tab5 Red Team Toolkit
;  by Kul3y3-Thric3 / Heavens Heathens / ProTechTor
;
;  Architecture:
;    ESP32-P4  — main processor, UI, orchestration
;    ESP32-C6  — built-in WiFi 6 + BLE 5.2 co-processor
;    ESP32-C5  — optional dual-band via M5Bus UART
; ============================================================

[platformio]
default_envs = talon5

[env]
framework     = arduino
monitor_speed = 115200

lib_deps =
    m5stack/M5Unified @ ^0.2.2
    m5stack/M5GFX @ ^0.2.4
    mikalhart/TinyGPSPlus @ ^1.0.3
    bblanchon/ArduinoJson @ ^7.0.4
    fastled/FastLED @ ^3.6.0
    SPI
    SD

; M5Stack Tab5 — ESP32-P4 main processor
[env:talon5]
platform    = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board       = m5stack-tab5-p4
board_build.flash_size   = 16MB
board_build.psram_type   = opi
board_build.arduino.memory_type = qio_opi

build_flags =
    ${env.build_flags}
    -D BOARD_TALON5
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D T5_DISPLAY_WIDTH=1280
    -D T5_DISPLAY_HEIGHT=720
    -D T5_HAS_TOUCH=1
    -D T5_HAS_CAMERA=1
    -D T5_HAS_IMU=1
    -D T5_HAS_SPEAKER=1
    -D T5_HAS_MIC=1
    -D T5_HAS_RTC=1
    -D T5_HAS_SD=1
    -D T5_HAS_C6=1
    -D T5_C5_UART=2
    -D DEBUG_SERIAL=1
    -I/Users/eyeluk/.platformio/packages/framework-arduinoespressif32-libs/esp32p4_es/qio_qspi/include
    -L/Users/eyeluk/.platformio/packages/framework-arduinoespressif32-libs/esp32p4_es/dio_qspi
    -L/Users/eyeluk/.platformio/packages/framework-arduinoespressif32-libs/esp32p4_es/lib
    -D FEATURE_WIFI=1
    -D FEATURE_BLE=1
    -D FEATURE_GPS=1
    -D FEATURE_SD=1
    -D FEATURE_DEAUTH=1
    -D FEATURE_BEACON_SPAM=1
    -D FEATURE_EVIL_PORTAL=1
    -D FEATURE_WARDRIVING=1
    -D FEATURE_BLE_SPAM=1
    -D FEATURE_SKYSPY=1
    -D FEATURE_FLOCKYOU=1
    -D FEATURE_FOXHUNTER=1
    -D FEATURE_CAMERA=1
    -D FEATURE_AUDIO=1
    -D FEATURE_KEYBOARD=1
